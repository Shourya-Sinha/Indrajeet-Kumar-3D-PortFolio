services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/shourya_portfolio
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-Krindrajeet.c@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeBeforeProduction!2026}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-random-64-char-secret}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtpout.secureserver.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-support@anantainfratechsolutions.com}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-support@anantainfratechsolutions.com}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-support@anantainfratechsolutions.com}
      GITHUB_USERNAME: Shourya-Sinha
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      - mongo
    volumes:
      - resume_storage:/app/storage
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  resume_storage:
